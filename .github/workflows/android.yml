name: Android APK

# Cada push a main compila un APK firmado (artefacto).
# Publica un Release descargable si el commit dice [release] o si se lanza a mano (Run workflow).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRENZAO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Versión
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "PRENZAO_VERSION_NAME=${BASE}-build.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Dependencias
        run: npm ci

      - name: Typecheck + build web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Llave de firma (secreto PRENZAO_SIGNING)
        id: key
        env:
          PRENZAO_SIGNING: ${{ secrets.PRENZAO_SIGNING }}
        run: |
          if [ -z "$PRENZAO_SIGNING" ]; then
            echo "::warning::Falta el secreto PRENZAO_SIGNING → no se compila el APK (sin la misma firma no se puede actualizar encima). Ver README → 'Firma'."
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "ok=true" >> $GITHUB_OUTPUT
          mkdir -p $RUNNER_TEMP/sign
          echo "$PRENZAO_SIGNING" | base64 -d | tar xz -C $RUNNER_TEMP/sign
          cat $RUNNER_TEMP/sign/signing.env >> $GITHUB_ENV
          echo "PRENZAO_KEYSTORE_PATH=$RUNNER_TEMP/sign/prenzao-release.jks" >> $GITHUB_ENV

      - name: Compilar APK firmado
        if: steps.key.outputs.ok == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mv app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Prenzao-${PRENZAO_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true # la cuota de artefactos de la cuenta puede llenarse; el Release no depende de esto
        with:
          name: Prenzao-${{ env.PRENZAO_VERSION_NAME }}
          path: Prenzao-*.apk
          retention-days: 3

      - name: Publicar Release
        if: steps.key.outputs.ok == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PRENZAO_VERSION_NAME }}
          name: Prenzao ${{ env.PRENZAO_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: Prenzao-*.apk
          make_latest: true
          generate_release_notes: true
